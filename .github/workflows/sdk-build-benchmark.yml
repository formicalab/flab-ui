name: SDK build benchmark

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: APK-capable OpenWrt SDK archive
        required: true
        default: https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.4.0_musl.Linux-x86_64.tar.zst
      sdk_sha256:
        description: Expected SHA-256 of the SDK archive
        required: true
        default: db695df9e4d6c7204502d4535b4a9e9b9bb3c269e4be39f5aa3dac0b62d12ee9

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout flab-ui
        uses: actions/checkout@v4

      - name: Checkout package definition
        uses: actions/checkout@v4
        with:
          repository: formicalab/packages
          ref: flab-ui
          path: packages

      - name: Install SDK extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd

      - name: Download SDK
        run: |
          start=$(date +%s)
          curl --fail --location --retry 3 "${{ inputs.sdk_url }}" --output /tmp/openwrt-sdk.tar.zst
          echo "download_seconds=$(($(date +%s) - start))" >> "$GITHUB_OUTPUT"
          echo "${{ inputs.sdk_sha256 }}  /tmp/openwrt-sdk.tar.zst" | sha256sum --check
        id: download

      - name: Extract SDK
        run: |
          start=$(date +%s)
          tar --zstd -xf /tmp/openwrt-sdk.tar.zst -C "$RUNNER_TEMP"
          sdk=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'openwrt-sdk-*' -print -quit)
          test -n "$sdk"
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "extract_seconds=$(($(date +%s) - start))" >> "$GITHUB_OUTPUT"
        id: extract

      - name: Configure working-tree package
        run: |
          start=$(date +%s)
          sdk="${{ steps.extract.outputs.sdk }}"
          mkdir -p "$sdk/package"
          bash tools/stage-source.sh packages/admin/flab-ui "$sdk/package/flab-ui" "$GITHUB_WORKSPACE" \
            "$(date -u +%Y%m%d%H%M)"
          printf 'CONFIG_PACKAGE_flab-ui=m\n' >> "$sdk/.config"
          make -C "$sdk" defconfig
          echo "setup_seconds=$(($(date +%s) - start))" >> "$GITHUB_OUTPUT"
        id: setup

      - name: Compile APK packages
        run: |
          start=$(date +%s)
          make -C "${{ steps.extract.outputs.sdk }}" -j"$(nproc)" package/flab-ui/compile
          echo "compile_seconds=$(($(date +%s) - start))" >> "$GITHUB_OUTPUT"
        id: compile

      - name: Record benchmark
        env:
          DOWNLOAD_SECONDS: ${{ steps.download.outputs.download_seconds }}
          EXTRACT_SECONDS: ${{ steps.extract.outputs.extract_seconds }}
          SETUP_SECONDS: ${{ steps.setup.outputs.setup_seconds }}
          COMPILE_SECONDS: ${{ steps.compile.outputs.compile_seconds }}
        run: |
          total=$((DOWNLOAD_SECONDS + EXTRACT_SECONDS + SETUP_SECONDS + COMPILE_SECONDS))
          report="$RUNNER_TEMP/sdk-build-timings.txt"
          {
            echo "download=${DOWNLOAD_SECONDS}s"
            echo "extract=${EXTRACT_SECONDS}s"
            echo "setup=${SETUP_SECONDS}s"
            echo "compile=${COMPILE_SECONDS}s"
            echo "total=${total}s"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          find "${{ steps.extract.outputs.sdk }}/bin/packages" -type f -name 'flab-ui*.apk' -print

      - name: Upload timing report and APKs
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build-benchmark
          path: |
            ${{ runner.temp }}/sdk-build-timings.txt
            ${{ steps.extract.outputs.sdk }}/bin/packages/**/flab-ui*.apk
